<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Кабинет поставщика «Фарватер»</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Интерактивный прототип сервиса «Фарватер»: оценка исполнимости госзакупок для малого поставщика.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%2313253D'/%3E%3Cpath d='M24 7l3.2 13.8L41 24l-13.8 3.2L24 41l-3.2-13.8L7 24l13.8-3.2z' fill='%23D6B26A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: fixed chart-room sidebar + working deck; nautical-chart graticule as ground.
   Dark "night watch" is the default look; light "chart paper" via data-theme="light". */
:root{
  --bg:#040912;--bg2:#06101C;--panel:#0A1524;--panel2:#0E1C30;--raise:#13253D;
  --line:rgba(169,189,210,.12);--line2:rgba(169,189,210,.24);--line3:rgba(169,189,210,.06);
  --tx:#EDE8DE;--tx2:rgba(237,232,222,.74);--tx3:rgba(237,232,222,.5);--tx4:rgba(237,232,222,.3);
  --steel:#7C97B4;--steel2:#A9BDD2;
  --gold:#D6B26A;--gold2:#EDD6A0;--goldInk:#1A1408;--goldGlow:rgba(214,178,106,.28);
  --go:#6FCB9C;--cond:#F2A24B;--stop:#EB6A55;--info:#8DB5E2;
  --go-bg:rgba(111,203,156,.09);--cond-bg:rgba(242,162,75,.09);--stop-bg:rgba(235,106,85,.09);--info-bg:rgba(141,181,226,.09);
  --go-br:rgba(111,203,156,.32);--cond-br:rgba(242,162,75,.32);--stop-br:rgba(235,106,85,.34);--info-br:rgba(141,181,226,.3);
  --water:#08192B;--water2:#0C2238;--sand:rgba(235,106,85,.13);
  --scrim:rgba(2,5,10,.66);--shadow:0 24px 70px rgba(0,0,0,.55);--shadow2:0 10px 30px rgba(0,0,0,.35);
  --grid:rgba(124,151,180,.045);
  --disp:'Oswald','Arial Narrow',Impact,sans-serif;
  --txt:'Onest','Segoe UI',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono','SFMono-Regular',Consolas,monospace;
  --ez:cubic-bezier(.16,1,.3,1);
  --r:12px;--r2:8px;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#E7E2D5;--bg2:#EEEADF;--panel:#F7F4EC;--panel2:#FBF9F4;--raise:#FFFFFF;
  --line:rgba(16,33,58,.11);--line2:rgba(16,33,58,.22);--line3:rgba(16,33,58,.05);
  --tx:#0D1B2E;--tx2:rgba(13,27,46,.76);--tx3:rgba(13,27,46,.54);--tx4:rgba(13,27,46,.32);
  --steel:#4B6788;--steel2:#2F4A6A;
  --gold:#A57F2C;--gold2:#7E5F1C;--goldInk:#FFF8E6;--goldGlow:rgba(165,127,44,.22);
  --go:#2C8A5D;--cond:#BF640E;--stop:#C23E2C;--info:#2F69A8;
  --go-bg:rgba(44,138,93,.09);--cond-bg:rgba(191,100,14,.09);--stop-bg:rgba(194,62,44,.08);--info-bg:rgba(47,105,168,.08);
  --go-br:rgba(44,138,93,.32);--cond-br:rgba(191,100,14,.32);--stop-br:rgba(194,62,44,.32);--info-br:rgba(47,105,168,.3);
  --water:#D3E1E8;--water2:#C1D5DF;--sand:rgba(194,62,44,.12);
  --scrim:rgba(13,27,46,.42);--shadow:0 24px 70px rgba(13,27,46,.22);--shadow2:0 10px 30px rgba(13,27,46,.12);
  --grid:rgba(47,74,106,.06);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--txt);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:72px 72px}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 500px at 85% -10%,var(--goldGlow),transparent 60%),radial-gradient(800px 600px at -10% 110%,rgba(124,151,180,.10),transparent 60%);opacity:.55}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:600}
p{margin:0}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}
.disp{font-family:var(--disp);letter-spacing:.01em}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
::selection{background:var(--goldGlow)}
[hidden]{display:none!important}

/* ===== APP SHELL ===== */
.app{position:relative;z-index:1;display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;height:100dvh;display:flex;flex-direction:column;gap:2px;
  padding:18px 14px 16px max(14px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);
  background:linear-gradient(180deg,var(--panel),var(--bg2));overflow-y:auto;scrollbar-width:thin;z-index:40}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 18px;cursor:pointer}
.brand svg{flex-shrink:0}
.brand .nm{font-family:var(--disp);font-size:22px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;line-height:1}
.brand .tg{font-size:10.5px;color:var(--tx3);letter-spacing:.02em;margin-top:5px;line-height:1.25}
.grp{font-family:var(--disp);font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--tx4);padding:16px 12px 6px}
.nav{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;color:var(--tx2);cursor:pointer;border:1px solid transparent;
  background:none;width:100%;text-align:left;font-size:13.5px;font-weight:500;transition:background .18s,color .18s,border-color .18s;position:relative}
.nav:hover{background:var(--line3);color:var(--tx)}
.nav.on{color:var(--tx);background:linear-gradient(90deg,var(--goldGlow),transparent 85%);border-color:var(--line)}
.nav.on::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--gold);box-shadow:0 0 12px var(--gold)}
.nav svg{width:18px;height:18px;flex-shrink:0;opacity:.85}
.nav .bdg{margin-left:auto;font-family:var(--mono);font-size:10px;padding:1px 7px;border-radius:10px;background:var(--stop-bg);color:var(--stop);border:1px solid var(--stop-br)}
.nav .bdg.n{background:var(--info-bg);color:var(--info);border-color:var(--info-br)}
.plan-card{margin-top:auto;border:1px solid var(--line2);border-radius:12px;padding:14px;background:linear-gradient(160deg,var(--raise),var(--panel));position:relative;overflow:hidden}
.plan-card::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.plan-card .k{font-family:var(--disp);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--tx3)}
.plan-card .t{font-family:var(--disp);font-size:18px;font-weight:500;margin:4px 0 2px;letter-spacing:.02em}
.plan-card .s{font-size:11.5px;color:var(--tx3)}
.plan-card .btn{width:100%;margin-top:10px}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:10px;
  padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));
  border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.search{flex:1;max-width:460px;display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--panel);color:var(--tx3);cursor:text;font-size:13px;min-width:0}
.search span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search kbd{margin-left:auto;font-family:var(--mono);font-size:10px;border:1px solid var(--line2);border-radius:5px;padding:1px 6px;color:var(--tx3);white-space:nowrap}
.demo-pill{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--gold);border:1px solid var(--goldGlow);background:var(--goldGlow);padding:4px 9px;border-radius:20px;white-space:nowrap}
.ic-btn{width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--tx2);cursor:pointer;position:relative;flex-shrink:0;transition:border-color .2s,color .2s}
.ic-btn:hover{border-color:var(--line2);color:var(--tx)}
.ic-btn svg{width:18px;height:18px}
.ic-btn .dot{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--stop);box-shadow:0 0 0 2px var(--panel)}
.me{display:flex;align-items:center;gap:10px;padding:4px 12px 4px 4px;border:1px solid var(--line);border-radius:40px;background:var(--panel);cursor:pointer;min-width:0}
.me .av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:13px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--goldInk);flex-shrink:0}
.me .n{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.me .c{font-family:var(--mono);font-size:9.5px;color:var(--tx3)}
#menuBtn{display:none}

.view{padding:26px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px));max-width:1360px;width:100%;margin:0 auto;animation:vin .5s var(--ez)}
@keyframes vin{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.vh .eyebrow{font-family:var(--disp);font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.vh h1{font-family:var(--disp);font-size:clamp(26px,3.2vw,36px);font-weight:500;letter-spacing:.01em;line-height:1.05}
.vh .sub{color:var(--tx3);margin-top:7px;font-size:13.5px;max-width:70ch}
.vh .acts{display:flex;gap:8px;flex-wrap:wrap}

/* ===== PRIMITIVES ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--line2);background:var(--panel2);color:var(--tx);transition:transform .15s,border-color .2s,background .2s,box-shadow .2s;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--steel);background:var(--raise)}
.btn:active{transform:translateY(1px)}
.btn svg{width:16px;height:16px}
.btn.gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--goldInk);border-color:transparent;box-shadow:0 8px 24px var(--goldGlow)}
.btn.gold:hover{box-shadow:0 10px 32px var(--goldGlow);filter:brightness(1.05)}
.btn.ghost{background:transparent}
.btn.go{background:var(--go-bg);color:var(--go);border-color:var(--go-br)}
.btn.stop{background:var(--stop-bg);color:var(--stop);border-color:var(--stop-br)}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:8px}
.btn.lg{padding:12px 22px;font-size:14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;border:1px solid var(--line2);color:var(--tx2);white-space:nowrap;line-height:1.5}
.chip.go{color:var(--go);background:var(--go-bg);border-color:var(--go-br)}
.chip.cond{color:var(--cond);background:var(--cond-bg);border-color:var(--cond-br)}
.chip.stop{color:var(--stop);background:var(--stop-bg);border-color:var(--stop-br)}
.chip.info{color:var(--info);background:var(--info-bg);border-color:var(--info-br)}
.chip.gold{color:var(--gold);background:var(--goldGlow);border-color:var(--goldGlow)}
.chip.mono{font-family:var(--mono);font-weight:500;font-size:10px;letter-spacing:.04em}
.tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;padding:2px 7px;border-radius:4px;border:1px solid var(--line2);color:var(--tx3);white-space:nowrap}
.card{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h3{font-family:var(--disp);font-size:15px;font-weight:500;letter-spacing:.04em;text-transform:uppercase}
.card-h .note{font-size:12px;color:var(--tx3)}
.card-b{padding:16px 18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--tx3)}
.small{font-size:12px}
.hr{height:1px;background:var(--line);margin:14px 0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.kv:last-child{border-bottom:none}
.kv span{color:var(--tx3)}
.kv b{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.empty{padding:30px;text-align:center;color:var(--tx3);font-size:13px}

/* KPI */
.kpi{padding:16px 18px;position:relative;overflow:hidden}
.kpi .l{font-family:var(--disp);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--tx3)}
.kpi .v{font-family:var(--disp);font-size:30px;font-weight:500;letter-spacing:.01em;margin-top:6px;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .d{font-size:11.5px;margin-top:6px;color:var(--tx3);max-width:calc(100% - 96px)}
.kpi .d.up{color:var(--go)}
.kpi svg.spark{position:absolute;right:12px;bottom:12px;width:90px;height:34px;opacity:.9}

/* buoy */
.buoy{display:inline-block;flex-shrink:0}
.verdict-chip{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;padding:4px 11px 4px 6px;border-radius:20px;border:1px solid;white-space:nowrap}
.verdict-chip.go{color:var(--go);border-color:var(--go-br);background:var(--go-bg)}
.verdict-chip.cond{color:var(--cond);border-color:var(--cond-br);background:var(--cond-bg)}
.verdict-chip.stop{color:var(--stop);border-color:var(--stop-br);background:var(--stop-bg)}

/* score ring */
.ring{position:relative;flex-shrink:0}
.ring svg{display:block;transform:rotate(-90deg)}
.ring .rv{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:15px;font-weight:500}

/* ===== DASHBOARD ===== */
.hero{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:0;overflow:hidden;position:relative}
.sonar-wrap{position:relative;aspect-ratio:1/1;max-width:100%;border-right:1px solid var(--line);background:radial-gradient(circle at 50% 50%,var(--water2),var(--water) 70%)}
.sonar-wrap canvas{width:100%;height:100%;display:block}
.sonar-tip{position:absolute;pointer-events:none;background:var(--raise);border:1px solid var(--line2);border-radius:8px;padding:7px 10px;font-size:12px;box-shadow:var(--shadow2);max-width:220px;transform:translate(-50%,calc(-100% - 12px));z-index:3}
.sonar-legend{position:absolute;left:12px;bottom:10px;display:flex;gap:10px;font-size:10.5px;color:var(--tx3);flex-wrap:wrap}
.sonar-legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
.hero-body{padding:24px 26px;display:flex;flex-direction:column;gap:18px;min-width:0}
.hero-body .k{font-family:var(--disp);font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold)}
.hero-body h2{font-family:var(--disp);font-size:clamp(24px,2.6vw,32px);font-weight:500;line-height:1.1}
.hero-body h2 em{font-style:normal;color:var(--gold)}
.vcount{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.vcount button{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;transition:border-color .2s,background .2s}
.vcount button:hover{border-color:var(--line2);background:var(--line3)}
.vcount .n{font-family:var(--disp);font-size:28px;line-height:1}
.vcount .t{font-size:11.5px;color:var(--tx3);display:flex;gap:6px;align-items:center}
.deadline{display:flex;align-items:center;gap:14px;border:1px dashed var(--line2);border-radius:10px;padding:12px 14px;cursor:pointer}
.deadline:hover{border-color:var(--gold)}
.cd{display:flex;gap:6px;margin-left:auto}
.cd div{text-align:center;min-width:44px;padding:5px 6px;border-radius:7px;background:var(--panel2);border:1px solid var(--line)}
.cd b{display:block;font-family:var(--disp);font-size:18px;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums}
.cd span{font-size:9px;color:var(--tx3);text-transform:uppercase;letter-spacing:.1em}
.list-it{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s}
.list-it:last-child{border-bottom:none}
.list-it:hover{background:var(--line3)}
.list-it .t{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-it .m{font-size:11.5px;color:var(--tx3);margin-top:2px;display:flex;gap:12px;flex-wrap:wrap}
.list-it .grow{flex:1;min-width:0}
.welcome{display:flex;gap:18px;align-items:center;padding:16px 20px;background:linear-gradient(110deg,var(--goldGlow),transparent 70%);border-color:var(--goldGlow)}
.welcome .grow{flex:1;min-width:0}
.welcome b{font-family:var(--disp);font-size:16px;font-weight:500;letter-spacing:.02em}

/* ===== PROCUREMENTS LIST ===== */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.input{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:8px 12px;background:var(--panel);min-width:0}
.input input{border:none;background:none;outline:none;min-width:0;width:100%;font-size:13px}
.input svg{width:16px;height:16px;color:var(--tx3);flex-shrink:0}
.seg{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:10px;background:var(--panel);flex-wrap:wrap}
.seg button{border:none;background:none;padding:6px 11px;border-radius:7px;font-size:12px;font-weight:600;color:var(--tx3);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.seg button:hover{color:var(--tx)}
.seg button.on{background:var(--raise);color:var(--tx);box-shadow:var(--shadow2)}
.seg button .c{font-family:var(--mono);font-size:10px;opacity:.7}
select.sel{max-width:100%;min-width:0;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--panel);font-size:12.5px;cursor:pointer}
.proc{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:16px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s;position:relative}
.proc:last-child{border-bottom:none}
.proc:hover{background:var(--line3)}
.proc::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--sv,transparent)}
.proc .t{font-weight:600;font-size:14px;line-height:1.35}
.proc .c{font-size:12px;color:var(--tx3);margin-top:3px}
.proc .m{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.proc .money{text-align:right}
.proc .money b{font-family:var(--disp);font-size:18px;font-weight:500;display:block;font-variant-numeric:tabular-nums}
.proc .money span{font-size:11px;color:var(--tx3)}
.proc .side-r{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.star{border:none;background:none;cursor:pointer;color:var(--tx4);padding:4px;display:inline-flex}
.star.on{color:var(--gold)}
.star svg{width:17px;height:17px}

/* ===== DETAIL ===== */
.verdict{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:22px;align-items:center;padding:22px 24px;position:relative;overflow:hidden}
.verdict::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(500px 200px at 0% 50%,var(--vglow,transparent),transparent 70%)}
.verdict .vk{font-family:var(--disp);font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--tx3)}
.verdict .vt{font-family:var(--disp);font-size:clamp(26px,3vw,38px);font-weight:500;line-height:1.05;margin-top:4px;color:var(--vc)}
.verdict .vs{color:var(--tx2);margin-top:8px;max-width:70ch;font-size:13.5px}
.verdict .lp{text-align:right;border-left:1px solid var(--line);padding-left:22px;position:relative;z-index:1}
.verdict .lp .l{font-family:var(--disp);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--tx3)}
.verdict .lp .v{font-family:var(--disp);font-size:28px;font-weight:500;color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
.verdict .lp .s{font-size:12px;color:var(--tx3)}
.buoy-anim{animation:bob 3.2s ease-in-out infinite;transform-origin:50% 90%}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-4px) rotate(2deg)}}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:18px 0 16px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:none;background:none;padding:10px 14px;font-size:13px;font-weight:600;color:var(--tx3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;gap:7px;align-items:center}
.tabs button:hover{color:var(--tx)}
.tabs button.on{color:var(--tx);border-bottom-color:var(--gold)}
.tabs .c{font-family:var(--mono);font-size:10px;padding:0 6px;border-radius:8px;background:var(--line);color:var(--tx2)}
.clause{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;padding:16px 18px;border-bottom:1px solid var(--line)}
.clause:last-child{border-bottom:none}
.clause .ico{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;border:1px solid;font-weight:700;font-size:13px}
.clause .ico.ok{color:var(--go);border-color:var(--go-br);background:var(--go-bg)}
.clause .ico.cond{color:var(--cond);border-color:var(--cond-br);background:var(--cond-bg)}
.clause .ico.stop{color:var(--stop);border-color:var(--stop-br);background:var(--stop-bg)}
.clause .ico.info{color:var(--info);border-color:var(--info-br);background:var(--info-bg)}
.clause .hd{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.clause .hd b{font-size:14px}
.clause .ref{font-family:var(--mono);font-size:10.5px;color:var(--gold);cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px;background:none;border:none;padding:0}
.clause blockquote{margin:8px 0 0;padding:8px 12px;border-left:2px solid var(--gold);background:var(--line3);font-size:12.5px;color:var(--tx2);font-style:italic;border-radius:0 6px 6px 0}
.clause .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:10px}
.clause .two div{font-size:12.5px;color:var(--tx2)}
.clause .two small{display:block;font-family:var(--disp);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--tx4);margin-bottom:2px}
.clause .ft{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.clause .ft .btn{margin-left:auto;white-space:normal;text-align:left}
.clause.resolved{opacity:.72}
.dossier .big{font-family:var(--disp);font-size:24px;font-weight:500}
.bar{height:7px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:var(--gold);transition:width .8s var(--ez)}
.files .f{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--line);border-radius:9px;margin-bottom:8px;cursor:pointer;transition:border-color .2s}
.files .f:hover{border-color:var(--gold)}
.files .f .fi{width:34px;height:40px;border-radius:5px;background:var(--panel2);border:1px solid var(--line2);display:flex;align-items:flex-end;justify-content:center;font-family:var(--mono);font-size:8.5px;padding-bottom:4px;color:var(--steel2)}
.timeline{position:relative;padding-left:22px}
.timeline::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:1.5px;background:var(--line2)}
.timeline .it{position:relative;padding-bottom:14px;font-size:13px}
.timeline .it::before{content:"";position:absolute;left:-21px;top:5px;width:11px;height:11px;border-radius:50%;border:2px solid var(--steel);background:var(--panel)}
.timeline .it.g::before{border-color:var(--go)}
.timeline .it.a::before{border-color:var(--gold);box-shadow:0 0 10px var(--gold)}
.timeline .it small{display:block;font-family:var(--mono);font-size:10px;color:var(--tx3)}

/* ===== FAIRWAY (price channel) ===== */
.fairway{position:relative;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.fairway svg{width:100%;height:auto;display:block;overflow:visible}
.fw-read{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px}
.fw-read div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel2)}
.fw-read small{display:block;font-family:var(--disp);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--tx3)}
.fw-read b{font-family:var(--disp);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
.range{width:100%;accent-color:var(--gold);margin:10px 0 0}
.wf{display:flex;height:34px;border-radius:7px;overflow:hidden;border:1px solid var(--line)}
.wf div{height:100%;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:600;color:var(--goldInk);white-space:nowrap;overflow:hidden;transition:flex-basis .5s var(--ez)}
.wf-leg{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12px}
.wf-leg span{display:inline-flex;gap:7px;align-items:center;color:var(--tx2)}
.wf-leg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld label{font-family:var(--disp);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx3)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:9px 11px;font-size:13.5px;outline:none;width:100%;transition:border-color .2s}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--gold)}
.fld .hint{font-size:11px;color:var(--tx4)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form .full{grid-column:1/-1}
.sw{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px dashed var(--line)}
.sw:last-child{border-bottom:none}
.sw .tx b{display:block;font-size:13.5px;font-weight:600}
.sw .tx span{font-size:12px;color:var(--tx3)}
.toggle{position:relative;width:42px;height:24px;flex-shrink:0}
.toggle input{opacity:0;position:absolute;inset:0;cursor:pointer;margin:0;z-index:1}
.toggle i{position:absolute;inset:0;border-radius:20px;background:var(--line2);transition:background .2s}
.toggle i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--tx);transition:transform .25s var(--ez)}
.toggle input:checked+i{background:var(--gold)}
.toggle input:checked+i::after{transform:translateX(18px);background:var(--goldInk)}
.toggle input:focus-visible+i{outline:2px solid var(--gold);outline-offset:2px}
.chips-ed{display:flex;flex-wrap:wrap;gap:6px}
.chips-ed .chip{cursor:pointer}
.chips-ed .chip.on{color:var(--gold);border-color:var(--gold);background:var(--goldGlow)}

/* ===== CONTRACTS ===== */
.pipe{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin:14px 0 4px;position:relative}
.pipe .st{position:relative;padding:0 8px 0 0;min-width:0}
.pipe .st .dotl{display:flex;align-items:center;gap:0}
.pipe .st .d{width:26px;height:26px;border-radius:50%;border:2px solid var(--line2);background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--tx3);flex-shrink:0;z-index:1}
.pipe .st .ln{height:2px;flex:1;background:var(--line2)}
.pipe .st.done .d{border-color:var(--go);background:var(--go);color:var(--bg)}
.pipe .st.done .ln{background:var(--go)}
.pipe .st.cur .d{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 4px var(--goldGlow)}
.pipe .st.late .d{border-color:var(--stop);color:var(--stop);box-shadow:0 0 0 4px var(--stop-bg)}
.pipe .st b{display:block;font-size:12.5px;margin-top:8px}
.pipe .st span{display:block;font-size:11px;color:var(--tx3)}
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:10px;border:1px solid;font-size:13px}
.alert.stop{border-color:var(--stop-br);background:var(--stop-bg)}
.alert.cond{border-color:var(--cond-br);background:var(--cond-bg)}
.alert.go{border-color:var(--go-br);background:var(--go-bg)}
.alert.info{border-color:var(--info-br);background:var(--info-bg)}
.alert b{display:block}
.alert .grow{flex:1;min-width:0}

/* ===== CALENDAR ===== */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal .dh{font-family:var(--disp);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--tx3);padding:8px 10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.cal .dc{min-height:104px;padding:6px 7px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .dc.out{background:var(--line3)}
.cal .dc.out .dn{opacity:.4}
.cal .dc.we .dn{color:var(--stop)}
.cal .dc.today{background:var(--goldGlow)}
.cal .dn{font-family:var(--disp);font-size:13px;color:var(--tx2)}
.cal .ev{font-size:10.5px;line-height:1.3;padding:3px 6px;border-radius:5px;cursor:pointer;border-left:2px solid;background:var(--panel2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .ev.go{border-color:var(--go)}.cal .ev.cond{border-color:var(--cond)}.cal .ev.stop{border-color:var(--stop)}.cal .ev.info{border-color:var(--info)}.cal .ev.gold{border-color:var(--gold)}
.agenda .a{display:flex;gap:14px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.agenda .a .dd{width:52px;text-align:center;flex-shrink:0}
.agenda .a .dd b{font-family:var(--disp);font-size:22px;font-weight:500;display:block;line-height:1}
.agenda .a .dd span{font-size:10px;color:var(--tx3);text-transform:uppercase}

/* ===== DOCS ===== */
.tpl{display:flex;flex-direction:column;gap:10px;padding:18px;cursor:pointer;transition:border-color .2s,transform .2s}
.tpl:hover{border-color:var(--gold);transform:translateY(-2px)}
.tpl .ic{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--goldGlow);color:var(--gold)}
.tpl .ic svg{width:20px;height:20px}
.tpl b{font-size:14.5px}
.tpl p{font-size:12.5px;color:var(--tx3)}
.paper{background:#FBF8F1;color:#16202E;border-radius:6px;padding:40px 46px;font-family:'Times New Roman',Times,serif;font-size:14.5px;line-height:1.55;box-shadow:var(--shadow2);max-width:760px;margin:0 auto;outline:none}
.paper h2{font-family:'Times New Roman',Times,serif;font-size:16px;text-align:center;margin:18px 0 12px;font-weight:700;text-transform:uppercase}
.paper p{margin:0 0 9px;text-align:justify}
.paper .rt{text-align:right}
.paper table{width:100%;border-collapse:collapse;font-size:13px;margin:10px 0}
.paper td,.paper th{border:1px solid #9AA3AE;padding:6px 8px;vertical-align:top;text-align:left}
.paper mark{background:#F3DFA6;color:inherit;padding:0 2px;border-radius:2px}
.paper mark.hl{background:#EDBF4E;box-shadow:0 0 0 3px #EDBF4E}

/* ===== ANALYTICS ===== */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--tx3);font-family:var(--txt);font-size:11px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--tx2);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* ===== PLANS ===== */
.plan{padding:20px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.plan.cur{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 16px 40px var(--goldGlow)}
.plan .pn{font-family:var(--disp);font-size:20px;font-weight:500;letter-spacing:.04em;text-transform:uppercase}
.plan .pp{font-family:var(--disp);font-size:30px;font-weight:500;line-height:1}
.plan .pp small{font-size:13px;color:var(--tx3);font-family:var(--txt);font-weight:400}
.plan ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px;font-size:12.5px;color:var(--tx2);flex:1}
.plan li{display:flex;gap:8px}
.plan li::before{content:"";width:6px;height:6px;margin-top:7px;border-radius:50%;background:var(--gold);flex-shrink:0}
.plan .rib{position:absolute;top:14px;right:14px}

/* ===== CHAT ===== */
.chat{display:grid;grid-template-columns:260px minmax(0,1fr);height:calc(100vh - 210px);min-height:460px;overflow:hidden}
.threads{border-right:1px solid var(--line);overflow-y:auto}
.threads .th{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.threads .th.on{background:var(--goldGlow)}
.threads .th b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.threads .th span{font-size:11.5px;color:var(--tx3);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv{display:flex;flex-direction:column;min-height:0;min-width:0}
.msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:78%;padding:10px 14px;border-radius:14px;font-size:13.5px;line-height:1.5;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--goldInk);border-bottom-right-radius:4px}
.msg.them{align-self:flex-start;background:var(--panel2);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg small{display:block;font-size:10.5px;opacity:.65;margin-top:4px}
.msg .who{font-weight:700;font-size:11.5px;margin-bottom:3px;color:var(--gold)}
.typing{display:inline-flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--tx3);animation:ty 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes ty{0%,60%,100%{opacity:.25;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);align-items:flex-end}
.composer textarea{flex:1;resize:none;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:10px 12px;outline:none;min-height:42px;max-height:120px;font-size:13.5px}
.composer textarea:focus{border-color:var(--gold)}
.sugg{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 10px}
.sugg button{border:1px solid var(--line2);background:none;border-radius:20px;padding:4px 10px;font-size:11.5px;color:var(--tx2);cursor:pointer}
.sugg button:hover{border-color:var(--gold);color:var(--tx)}

/* ===== OVERLAYS ===== */
.scrim{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);z-index:100;display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:min(640px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:16px;box-shadow:var(--shadow);animation:pop .35s var(--ez);display:flex;flex-direction:column}
.modal.wide{width:min(980px,100%)}
.modal.xl{width:min(1180px,100%)}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.m-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.m-h h3{font-family:var(--disp);font-size:19px;font-weight:500;letter-spacing:.02em}
.m-b{padding:20px 22px}
.m-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 22px;border-top:1px solid var(--line);flex-wrap:wrap;position:sticky;bottom:0;background:var(--panel)}
.x{border:none;background:none;cursor:pointer;color:var(--tx3);padding:6px;border-radius:8px;display:inline-flex}
.x:hover{color:var(--tx);background:var(--line3)}
.x svg{width:18px;height:18px}
#toasts{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));z-index:300;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{display:flex;gap:10px;align-items:center;background:var(--raise);border:1px solid var(--line2);border-radius:11px;padding:11px 16px;box-shadow:var(--shadow);font-size:13px;max-width:min(420px,calc(100vw - 36px));animation:tin .4s var(--ez);pointer-events:auto}
.toast .i{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--go-bg);color:var(--go);flex-shrink:0;font-size:12px;font-weight:700}
.toast.warn .i{background:var(--cond-bg);color:var(--cond)}
.toast.out{animation:tout .3s ease forwards}
@keyframes tin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateX(20px)}}
.pop{position:absolute;top:calc(100% + 8px);right:0;width:360px;max-width:calc(100vw - 32px);background:var(--panel);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow);z-index:60;animation:pop .25s var(--ez);overflow:hidden}
.pop .ph{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.pop .ph b{font-family:var(--disp);font-weight:500;letter-spacing:.06em;text-transform:uppercase;font-size:13px}
.ntf{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;position:relative}
.ntf:hover{background:var(--line3)}
.ntf.unread::after{content:"";position:absolute;right:14px;top:16px;width:7px;height:7px;border-radius:50%;background:var(--gold)}
.ntf .ni{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid}
.ntf b{display:block;font-size:13px;padding-right:14px}
.ntf span{font-size:11.5px;color:var(--tx3)}
.menu a,.menu button{display:flex;width:100%;gap:10px;align-items:center;padding:10px 16px;border:none;background:none;text-align:left;font-size:13px;cursor:pointer;color:var(--tx2);text-decoration:none}
.menu a:hover,.menu button:hover{background:var(--line3);color:var(--tx)}
.menu svg{width:16px;height:16px}
.cmd{width:min(620px,100%);align-self:flex-start;margin-top:10vh}
.cmd .ci{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.cmd .ci input{flex:1;border:none;background:none;outline:none;font-size:16px}
.cmd .res{max-height:52vh;overflow-y:auto;padding:6px}
.cmd .r{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:13.5px}
.cmd .r.on{background:var(--goldGlow)}
.cmd .r small{margin-left:auto;font-size:11px;color:var(--tx3);white-space:nowrap}
.cmd .gh{font-family:var(--disp);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--tx4);padding:10px 12px 4px}

/* scan animation */
.scan{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:22px;align-items:start}
.pages{position:relative;height:330px}

/* Buoys (латеральные/специальные знаки): green cone = «идём», yellow special = «при условии», red can = «не идём» */
function buoy(v, size = 22, anim = false){
  const c = v === 'go' ? 'var(--go)' : v === 'cond' ? 'var(--cond)' : 'var(--stop)';
  const top = v === 'go' ? '<path d="M12 2l5 8H7z" fill="'+c+'"/>'
    : v === 'stop' ? '<rect x="7.5" y="3" width="9" height="7" rx="1" fill="'+c+'"/>'
    : '<path d="M8 3l8 7M16 3l-8 7" stroke="'+c+'" stroke-width="2.4" stroke-linecap="round"/>';
  return '<svg class="buoy'+(anim?' buoy-anim':'')+'" width="'+size+'" height="'+size+'" viewBox="0 0 24 24" aria-hidden="true">'+top+
    '<path d="M11 10h2v3h-2z" fill="'+c+'"/><path d="M6 13h12l-2 6H8z" fill="'+c+'"/><path d="M6 13h12" stroke="var(--tx)" stroke-opacity=".25"/>'+
    '<path d="M2 21c2.5-1.5 4.5-1.5 7 0s4.5 1.5 7 0 4.5-1.5 6 0" stroke="var(--steel)" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>';
}

function ring(score, size = 44){
  const r = size/2 - 4, C = 2*Math.PI*r, col = score >= 70 ? 'var(--go)' : score >= 45 ? 'var(--cond)' : 'var(--stop)';
  return '<div class="ring" style="width:'+size+'px;height:'+size+'px" title="Оценка исполнимости '+score+' из 100"><svg width="'+size+'" height="'+size+'"><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="3.5"/><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="'+(C*score/100)+' '+C+'"/></svg><div class="rv" style="font-size:'+(size>50?20:14)+'px">'+score+'</div></div>';
}

/* =====================================================================
   РАСЧЁТ НИЖНЕЙ ЦЕНЫ
   Затраты = себестоимость + стоимость денег (себестоимость и обеспечение
   на срок «поставка → приёмка → оплата») + плата площадке + резерв штрафа
   (+ комиссия за банковскую гарантию, если обеспечение гарантией).
   Нижняя цена — граница, ниже которой исполнение убыточно.
   ===================================================================== */
function moneyDays(p){
  const start = today();
  const d1 = addWD(start, p.deliveryWD), d2 = addWD(d1, p.acceptWD), d3 = addWD(d2, p.payWD);
  return diffD(start, d3);
}
function riskProb(p, prof){
  const need = prof.leadWD + (p.install ? prof.installWD : 0);
  let r = prof.baseRisk;
  if (p.deliveryWD < need) r += p.resolved && p.resolved.delivery ? 0.03 : 0.18;
  else if (p.deliveryWD - need < 4) r += 0.04;
  if (p.region && !prof.regions.includes(p.region)) r += 0.03;
  return clamp(r, 0, 0.6);
}
function calc(p, prof, o = {}){
  const x = Object.assign({
    nmck:p.nmck, cost:p.cost, sec:p.sec, days:moneyDays(p), rate:prof.rate, platform:p.platform,
    penaltyPct:p.penaltyPct, prob:riskProb(p, prof), vat:prof.tax === 'osn', bg:!!(p.resolved && p.resolved.cash), bgRate:prof.bgRate, margin:prof.margin
  }, o);
  const vatK = x.vat ? 1.22 : 1;
  const secAmt = x.nmck * x.sec;
  const costMoney = x.cost * x.rate * x.days / 365;
  const secMoney = x.bg ? 0 : secAmt * x.rate * x.days / 365;
  const bgFee = x.bg ? Math.max(1500, secAmt * x.bgRate * x.days / 365) : 0;
  const penalty = x.nmck * x.penaltyPct * x.prob;
  const lowerNet = x.cost + costMoney + secMoney + bgFee + x.platform + penalty;
  const lower = lowerNet * vatK;
  const target = lowerNet * (1 + x.margin) * vatK;
  const typicalPrice = x.nmck * (1 - (p.typical ?? 0.1));
  const r = {x, vatK, secAmt, costMoney, secMoney, money:costMoney + secMoney, bgFee, penalty, lowerNet, lower, lowerPct:lower / x.nmck, target, targetPct:target / x.nmck, typicalPrice};
  r.at = bid => {
    const anti = bid <= x.nmck * 0.75;
    const sAmt = anti ? secAmt * 1.5 : secAmt;
    const sMon = x.bg ? 0 : sAmt * x.rate * x.days / 365;
    const bgf = x.bg ? Math.max(1500, sAmt * x.bgRate * x.days / 365) : 0;
    const costs = x.cost + costMoney + sMon + bgf + x.platform + penalty;
    const net = bid / vatK;
    return {bid, anti, costs, profit:net - costs, margin:(net - costs) / net, drop:1 - bid / x.nmck, secAmt:sAmt};
  };
  r.typical = r.at(typicalPrice);
  return r;
}

};

function docWrap(title, html){ return '<html><head><meta charset="utf-8"><title>' + esc(title) + '</title><style>body{font-family:"Times New Roman";font-size:14pt}table{border-collapse:collapse;width:100%}td,th{border:1px solid #888;padding:4px}h2{text-align:center}.rt{text-align:right}</style></head><body>' + html + '</body></html>'; }

function dropChart(p){
  const W = 520, H = 190, pl = 34, pb = 26, pt = 10;
  const vals = Array.from({length:12}, (_, i) => clamp(p.cust.drop + ((hash(p.id + i) % 100) / 100 - 0.5) * 0.16, 0.01, 0.35));
  const mx = 0.36, lowDrop = Math.max(0, 1 - ev(p).calc.lowerPct);
  const bw = (W - pl - 10) / 12;
  const y = v => pt + (H - pt - pb) * (v / mx);
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Снижение цены в закупках заказчика">';
  [0, 0.1, 0.2, 0.3].forEach(t => { s += '<line x1="' + pl + '" x2="' + (W - 6) + '" y1="' + y(t) + '" y2="' + y(t) + '" stroke="var(--line)"/><text x="' + (pl - 6) + '" y="' + (y(t) + 4) + '" text-anchor="end">−' + Math.round(t * 100) + '%</text>'; });
  vals.forEach((v, i) => { const over = v > lowDrop; s += '<rect x="' + (pl + i * bw + 4) + '" y="' + y(0) + '" width="' + (bw - 8) + '" height="' + (y(v) - y(0)) + '" rx="3" fill="' + (over ? 'var(--stop)' : 'var(--steel)') + '" fill-opacity="' + (over ? .75 : .55) + '"/>'; });
  s += '<line x1="' + pl + '" x2="' + (W - 6) + '" y1="' + y(lowDrop) + '" y2="' + y(lowDrop) + '" stroke="var(--gold)" stroke-width="1.6" stroke-dasharray="5 4"/><text x="' + (W - 8) + '" y="' + (y(lowDrop) - 6) + '" text-anchor="end" style="fill:var(--gold)">ваша граница −' + pct(lowDrop) + '</text>';
  s += '<text x="' + pl + '" y="' + (H - 6) + '">12 мес. назад</text><text x="' + (W - 6) + '" y="' + (H - 6) + '" text-anchor="end">сейчас</text></svg>';
  return s;
}

/* =====================================================================
   ui2.js — фарватер цены, калькулятор, контракты, календарь, документы,

/* ---------- ФАРВАТЕР ЦЕНЫ (интерактивная схема) ---------- */
const FW = {};
function fairwayBlock(key){
  return `<div class="fairway" id="fw-${key}"><svg viewBox="0 0 820 262" role="img" aria-label="Фарватер цены: зона убытка, узкий проход и фарватер с целевой маржой"></svg></div>
    <label class="muted small" for="fwr-${key}" style="display:block;margin-top:6px">Цена в заявке</label><input type="range" class="range" id="fwr-${key}">
    <div class="fw-read" id="fwo-${key}"></div><div id="fwn-${key}" style="margin-top:12px"></div>`;
}
function fwGeom(key){
  const el = $('#fw-' + key); const w = el ? el.getBoundingClientRect().width : 820;
  const c = w > 0 && w < 560;
  return c ? {c, VW:420, fs:12.5, step:0.06, tick:0.1, lw:70} : {c, VW:820, fs:10.5, step:0.03, tick:0.05, lw:96};
}
function bindFairway(key, p, o = {}, onBid){
  const cr = calc(p, S.profile, o), nmck = cr.x.nmck;
  const minP = clamp(Math.min(0.6, cr.lowerPct - 0.1), 0.35, 0.9);
  const st = FW[key] = {p, o, cr, minP, bid:clamp(p.bid || Math.round(Math.max(cr.target, nmck * 0.8) / 100) * 100, nmck * minP, nmck)};
  if (st.bid > nmck) st.bid = nmck;
  const rg = $('#fwr-' + key); rg.min = Math.round(nmck * minP); rg.max = nmck; rg.step = 100; rg.value = st.bid;
  rg.oninput = () => { st.bid = +rg.value; drawFW(key); };
  const svg = $('#fw-' + key + ' svg');
  const setX = e => { const g = fwGeom(key), b = svg.getBoundingClientRect(); const x = (e.clientX - b.left) / b.width * g.VW; const pp = minP + (x - 20) / (g.VW - 40) * (1.03 - minP); st.bid = clamp(Math.round(pp * nmck / 100) * 100, Math.round(nmck * minP), nmck); rg.value = st.bid; drawFW(key); };
  let drag = false;
  svg.onpointerdown = e => { drag = true; svg.setPointerCapture(e.pointerId); setX(e); };
  svg.onpointermove = e => { if (drag) { e.preventDefault(); setX(e); } };
  svg.onpointerup = svg.onpointercancel = () => { drag = false; };
  st.onBid = onBid;
  drawFW(key);
}
window.addEventListener('resize', () => { for (const k in FW) if ($('#fw-' + k)) drawFW(k); });
function drawFW(key){
  const st = FW[key], {cr, minP, p} = st, nmck = cr.x.nmck, G = fwGeom(key), VW = G.VW, y0 = 46, y1 = 196, ym = 121, FS = G.fs;
  const X = q => 20 + (q - minP) / (1.03 - minP) * (VW - 40);
  const lo = clamp(cr.lowerPct, minP, 1.03), tg = clamp(cr.targetPct, minP, 1);
  const b = cr.at(st.bid), bx = X(st.bid / nmck);
  $('#fw-' + key + ' svg').setAttribute('viewBox', `0 0 ${VW} 262`);
  let s = `<defs><pattern id="hatch-${key}" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="var(--sand)"/><line x1="0" y1="0" x2="0" y2="8" stroke="var(--stop)" stroke-opacity=".28" stroke-width="2"/></pattern>
    <linearGradient id="wg-${key}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--water2)"/><stop offset="1" stop-color="var(--water)"/></linearGradient></defs>
    <rect x="20" y="${y0}" width="${VW - 40}" height="${y1 - y0}" rx="10" fill="url(#wg-${key})"/>`;
  s += `<rect x="20" y="${y0}" width="${Math.max(0, X(lo) - 20)}" height="${y1 - y0}" fill="url(#hatch-${key})"/>`;
  if (cr.lowerPct < 1) {
    s += `<rect x="${X(lo)}" y="${y0}" width="${Math.max(0, X(tg) - X(lo))}" height="${y1 - y0}" fill="var(--cond-bg)"/>`;
    s += `<rect x="${X(tg)}" y="${y0}" width="${Math.max(0, X(1) - X(tg))}" height="${y1 - y0}" fill="var(--go-bg)"/>`;
    s += `<line x1="${X(lo)}" x2="${X(1)}" y1="${ym}" y2="${ym}" stroke="var(--go)" stroke-opacity=".6" stroke-dasharray="2 7" stroke-width="2"/>`;
  }
  s += `<rect x="${X(1)}" y="${y0}" width="${X(1.03) - X(1)}" height="${y1 - y0}" fill="var(--line)"/>`;
  s += `<line x1="20" x2="${VW - 20}" y1="${y0}" y2="${y0}" stroke="var(--steel)" stroke-opacity=".5"/><line x1="20" x2="${VW - 20}" y1="${y1}" y2="${y1}" stroke="var(--steel)" stroke-opacity=".5"/>`;
  for (let k = 0; k < 3; k++) { const yy = y0 + 22 + k * 52; let d = 'M24 ' + yy; for (let x = 24; x < VW - 24; x += 24) d += ' q6 -3 12 0 t12 0'; s += `<path d="${d}" fill="none" stroke="var(--steel)" stroke-opacity=".12"/>`; }
  const lbl = (x1, x2, t, c) => { if (x2 - x1 > G.lw) s += `<text x="${(x1 + x2) / 2}" y="${y0 + 18}" text-anchor="middle" style="fill:${c};font-family:var(--disp);font-size:${G.c ? 11 : 11}px;letter-spacing:.14em">${t}</text>`; };
  lbl(20, X(lo), G.c ? 'УБЫТОК' : 'МЕЛЬ · УБЫТОК', 'var(--stop)'); if (cr.lowerPct < 1) { lbl(X(lo), X(tg), G.c ? 'УЗКО' : 'УЗКИЙ ПРОХОД', 'var(--cond)'); lbl(X(tg), X(1), 'ФАРВАТЕР', 'var(--go)'); }
  for (let q = Math.ceil(minP / G.step) * G.step; q <= 1.0001; q += G.step) {
    const m = cr.at(q * nmck).margin * 100, x = X(q); if (Math.abs(x - bx) < 24) continue;
    const c = q < cr.lowerPct ? 'var(--stop)' : q < cr.targetPct ? 'var(--cond)' : 'var(--go)';
    s += `<text x="${x}" y="${ym + (Math.round(q * 100 / (G.step * 100)) % 2 ? -26 : 34)}" text-anchor="middle" style="fill:${c};font-style:italic;font-size:${FS + 1.5}px;opacity:.85">${(m < 0 ? '−' : '') + Math.abs(Math.round(m))}</text>`;
  }
  if (0.75 > minP) { const x = X(0.75); s += `<line x1="${x}" x2="${x}" y1="${y0 - 4}" y2="${y1 + 4}" stroke="var(--stop)" stroke-dasharray="4 4"/><text x="${x + 5}" y="${y1 - 8}" style="fill:var(--stop);font-size:${FS}px">${G.c ? '−25%' : '−25% антидемпинг'}</text>`; }
  if (cr.lowerPct <= 1.03) {
    const x = X(lo);
    s += `<g transform="translate(${x - 9} ${y0 + 26})"><rect x="3" y="0" width="12" height="9" rx="1.5" fill="var(--stop)"/><path d="M0 10h18l-3 8H3z" fill="var(--stop)"/></g>`;
    s += `<g transform="translate(${x - 9} ${y1 - 46})"><path d="M9 0l6 9H3z" fill="var(--go)"/><path d="M0 10h18l-3 8H3z" fill="var(--go)"/></g>`;
    const lx = clamp(x, 70, VW - 70);
    s += `<text x="${lx}" y="${y1 + 17}" text-anchor="middle" style="fill:var(--gold);font-size:${FS + 0.5}px;font-weight:600">нижняя ${short(cr.lower)}</text>`;
  }
  const tq = 1 - (p.typical ?? 0.1);
  if (tq > minP) { const x = X(tq), lx = clamp(x, 60, VW - 60); s += `<path d="M${x - 6} ${y1 + 33}l6 -9 6 9z" fill="var(--steel2)"/><text x="${lx}" y="${y1 + 48}" text-anchor="middle" style="fill:var(--steel2);font-size:${FS}px">${G.c ? 'обычно' : 'обычно у заказчика'} −${pct(p.typical ?? 0.1, 0)}</text>`; }
  for (let d = 0; d <= 1 - minP + 0.0001; d += G.tick) { const x = X(1 - d); s += `<line x1="${x}" x2="${x}" y1="${y0 - 6}" y2="${y0}" stroke="var(--steel)" stroke-opacity=".6"/><text x="${x}" y="${y0 - 10}" text-anchor="middle" style="font-size:${FS}px;fill:var(--tx3)">${d < 0.001 ? 'НМЦК' : '−' + Math.round(d * 100) + '%'}</text>`; }
  const col = b.profit < 0 ? 'var(--stop)' : b.margin < cr.x.margin ? 'var(--cond)' : 'var(--go)';
  s += `<line x1="${bx}" x2="${bx}" y1="${y0}" y2="${y1}" stroke="var(--gold)" stroke-width="1.5" stroke-dasharray="3 3"/>`;
  s += `<g transform="translate(${bx} ${ym})" style="cursor:grab"><path d="M14 4 q14 3 26 0 M16 9 q12 3 22 0" stroke="var(--tx3)" fill="none" stroke-width="1.2" opacity=".6"/>
    <path d="M-16 0h32l-6 9h-20z" fill="${col}"/><path d="M-1 -26v24" stroke="var(--tx)" stroke-width="1.6"/><path d="M1 -24l13 20H1z" fill="var(--tx)" fill-opacity=".9"/><path d="M-3 -22l-10 18h10z" fill="var(--tx)" fill-opacity=".55"/><circle r="26" fill="transparent"/></g>`;
  $('#fw-' + key + ' svg').innerHTML = s;
  // табло
  const pc = b.profit >= 0 ? 'go' : 'stop';
  $('#fwo-' + key).innerHTML = `<div><small>Цена заявки</small><b>${rub(st.bid)}</b></div><div><small>Снижение</small><b>−${pct(b.drop)}</b></div><div><small>Прибыль</small><b style="color:var(--${pc})">${b.profit >= 0 ? '+' : '−'}${rub(Math.abs(b.profit))}</b></div><div><small>Маржа</small><b style="color:${col}">${pct(b.margin)}</b></div>`;
  const msg = b.profit < 0 ? ['stop', 'На мели: ниже нижней цены на ' + rub(cr.lower - st.bid) + '. Контракт убыточен.']
    : b.margin < cr.x.margin ? ['cond', 'Узкий проход: прибыль есть, но маржа ниже целевой ' + pct(cr.x.margin, 0) + '.']
    : ['go', 'В фарватере: маржа выше целевой. Можно торговаться дальше до ' + rub(cr.target) + '.'];
  $('#fwn-' + key).innerHTML = `<div class="alert ${msg[0]}"><div class="grow"><b>${msg[1]}</b>${b.anti ? '<span class="small">Снижение 25% и более: антидемпинговые меры ст. 37 44-ФЗ — обеспечение исполнения в 1,5 раза больше (' + rub(b.secAmt) + '), стоимость денег пересчитана.</span>' : ''}</div>${p.id !== 'custom' && S.procs.includes(p) ? `<button class="btn sm" data-act="useBid" data-k="${key}">Взять цену в заявку</button>` : ''}</div>`;
}
ACT.useBid = el => { const st = FW[el.dataset.k]; st.p.bid = st.bid; log(st.p, 'Цена для заявки: ' + rub(st.bid)); save(); toast('Цена ' + rub(st.bid) + ' сохранена в чек-листе заявки'); };

function waterfall(cr){
  const base = Math.max(cr.x.nmck, cr.lower);
  const vk = cr.vatK;
  const seg = [['Себестоимость', cr.x.cost * vk, 'var(--steel2)'], ['Стоимость денег', cr.money * vk, 'var(--info)'], ['Банковская гарантия', cr.bgFee * vk, 'var(--gold2)'], ['Плата площадке', cr.x.platform * vk, 'var(--cond)'], ['Резерв штрафа', cr.penalty * vk, 'var(--stop)']].filter(x => x[1] > 0);
  const room = cr.x.nmck - cr.lower;
  return `<div class="wf">${seg.map(([t, v, c]) => `<div style="flex:0 0 ${v / base * 100}%;background:${c}" title="${t}: ${rub(v)}">${v / base > 0.12 ? short(v) : ''}</div>`).join('')}${room > 0 ? `<div style="flex:1;background:var(--go-bg);color:var(--go);border-left:2px solid var(--gold)">${room / base > 0.1 ? 'запас ' + short(room) : ''}</div>` : ''}</div>
    <div class="wf-leg">${seg.map(([t, v, c]) => `<span><i style="background:${c}"></i>${t} · <b class="num">${rub(v)}</b></span>`).join('')}${room > 0 ? `<span><i style="background:var(--go)"></i>Запас до НМЦК · <b class="num">${rub(room)}</b></span>` : ''}</div>

function cInfo(c){

}

  const act = S.contracts.filter(c => cInfo(c).cur), sum = act.reduce((a, c) => a + c.price, 0), late = S.contracts.filter(c => cInfo(c).late > 0).length;
  return `<div class="vh"><div><div class="eyebrow">Модуль «Контракт» · после победы</div><h1>Контракты</h1><div class="sub">Календарь обязательств в рабочих днях, контроль приёмки и оплаты, пени и претензии — по каждому контракту.</div></div></div>

  <div class="stack">${S.contracts.map(c => contractCard(c)).join('')}</div>`;
}
function contractCard(c){
  const inf = cInfo(c), cur = inf.cur;

  else if (cur.k === 'delivery') action = `<div class="alert ${inf.late ? 'stop' : diffD(today(), parse(cur.due)) <= 5 ? 'cond' : 'info'}"><div class="grow"><b>${inf.late ? 'Просрочка поставки ' + inf.late + ' ' + daysWord(inf.late) : 'Поставка ' + dueLabel(cur.due) + ' · до ' + dmy(cur.due)}</b><span class="small">Пени поставщика по ч. 7 ст. 34 44-ФЗ: 1/300 ключевой ставки (${pct(S.keyRate, 0)}) от цены контракта за каждый день — ${rub(peni(c.price, 1))} в день.</span>
      <div class="row small" style="margin-top:8px">Если опоздаем на <input type="number" min="1" max="120" value="${inf.late || 5}" data-act="noop" data-pen="${c.id}" style="width:64px;border:1px solid var(--line2);background:var(--panel2);border-radius:6px;padding:3px 6px"> дн. → пени <b id="pen-${c.id}">${rub(peni(c.price, inf.late || 5))}</b></div></div>
      <div class="row"><button class="btn sm" data-act="mkDoc" data-t="ready" data-cid="${c.id}">Уведомление</button><button class="btn sm gold" data-act="stage" data-id="${c.id}">Товар поставлен</button></div></div>`;

  return `<div class="card ctr"><div class="card-h"><div style="min-width:0"><h3 style="text-transform:none;letter-spacing:.01em;font-size:17px">${esc(c.title)}</h3><div class="muted small">${esc(c.customer)} · № ${c.num}</div></div><div class="row"><span class="chip ${!cur ? 'go' : inf.late ? 'stop' : 'gold'}">${!cur ? 'исполнен' : inf.late ? 'просрочка' : 'в графике'}</span><b class="disp num" style="font-size:20px;font-weight:500">${rub(c.price)}</b></div></div>
    <div class="card-b"><div class="pipe">${steps.map((s, i) => `<div class="st ${s.done ? 'done' : ''} ${s.cur ? 'cur' : ''} ${s.late ? 'late' : ''}"><div class="dotl"><span class="d">${s.done ? '✓' : i + 1}</span>${i < steps.length - 1 ? '<span class="ln"></span>' : ''}</div><b>${s.t}</b><span>${s.d}</span></div>`).join('')}</div>

function genDoc(type, srcId, key){

  }

  if (type === 'claim') {

      <p>По состоянию на ${dmy(today())} оплата не поступила. Просрочка составляет ${days} ${daysWord(days)}.</p>
      <p>Согласно части 5 статьи 34 ${lawFull} в случае просрочки исполнения заказчиком обязательств, предусмотренных контрактом, поставщик вправе потребовать уплаты пеней. Пеня начисляется за каждый день просрочки исполнения обязательства, начиная со дня, следующего после дня истечения установленного контрактом срока исполнения обязательства, в размере одной трехсотой действующей на дату уплаты пеней ключевой ставки Центрального банка Российской Федерации от не уплаченной в срок суммы.</p>
      <table><tr><th>Задолженность</th><th>Период просрочки</th><th>Дней</th><th>Ключевая ставка</th><th>Пеня</th></tr><tr><td>${rub(c.price)}</td><td>${pay.due ? dmy(addD(parse(pay.due), 1)) : '—'} — ${dmy(today())}</td><td>${days}</td><td>${pctK(S.keyRate)}</td><td>${rub(pn)}</td></tr></table>
      <p>Требуем в течение 10 календарных дней с даты получения настоящей претензии оплатить задолженность в размере ${rub(c.price)} и пени в размере ${rub(pn)}. В случае неисполнения требования Поставщик оставляет за собой право обратиться в арбитражный суд.</p>` + sign};
  }

}

  const total = months.reduce((a, m) => a + m.v[0] + m.v[1] + m.v[2], 0);
  return `<div class="vh"><div><div class="eyebrow">Последние 6 месяцев</div><h1>Аналитика</h1><div class="sub">Сколько закупок разобрано, от чего «Фарватер» уберёг и где вы зарабатываете.</div></div></div>

  <div class="grid g2">
    <div class="card chart"><div class="card-h"><h3>Вердикты по месяцам</h3></div><div class="card-b">${stackChart(months)}<div class="legend"><span><i style="background:var(--go)"></i>участвовать</span><span><i style="background:var(--cond)"></i>при условии</span><span><i style="background:var(--stop)"></i>не участвовать</span></div></div></div>

    <div class="card chart"><div class="card-h"><h3>Маржа по контрактам</h3><span class="note">пунктир — цель ${pct(S.profile.margin, 0)}</span></div><div class="card-b">${marginChart()}</div></div>
    <div class="card"><div class="card-h"><h3>Аудит решений</h3><span class="note">«зря взяли / зря пропустили»</span></div>${S.audits.map(a => `<div class="list-it" style="cursor:default"><span class="chip ${a.kind === 'Зря взяли' ? 'stop' : a.kind === 'Зря пропустили' ? 'cond' : 'go'}" style="min-width:118px;justify-content:center">${a.kind}</span><div class="grow"><div class="t" style="white-space:normal">${esc(a.t)}</div><div class="m"><span>${esc(a.note)}</span></div></div><b class="num" style="color:var(--${a.loss < 0 ? 'stop' : 'go'});white-space:nowrap">${a.loss ? (a.loss < 0 ? '−' : '+') + short(Math.abs(a.loss)) : '0 ₽'}</b></div>`).join('')}</div>
  </div>`;
}
function stackChart(months){
  const W = 520, H = 220, pl = 28, pb = 26, pt = 12, mx = Math.max(...months.map(m => m.v[0] + m.v[1] + m.v[2]));
  const top = Math.ceil(mx / 5) * 5, bw = (W - pl - 6) / months.length, y = v => H - pb - (H - pb - pt) * v / top;
  const cols = ['var(--go)', 'var(--cond)', 'var(--stop)'];
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Вердикты по месяцам">`;
  for (let t = 0; t <= top; t += 5) s += `<line x1="${pl}" x2="${W - 4}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${pl - 6}" y="${y(t) + 4}" text-anchor="end">${t}</text>`;
  months.forEach((m, i) => { let acc = 0; const x = pl + i * bw + bw * 0.2, w = bw * 0.6; m.v.forEach((v, j) => { if (!v) return; s += `<rect x="${x}" y="${y(acc + v)}" width="${w}" height="${y(acc) - y(acc + v) - 1.5}" rx="2" fill="${cols[j]}" fill-opacity="${i === months.length - 1 ? 1 : 0.78}"><title>${MONN[m.m.getMonth()]}: ${v}</title></rect>`; acc += v; }); s += `<text x="${x + w / 2}" y="${y(acc) - 6}" text-anchor="middle" style="fill:var(--tx2);font-weight:600">${acc}</text><text x="${x + w / 2}" y="${H - 8}" text-anchor="middle">${MONS[m.m.getMonth()]}</text>`; });
  return s + '</svg>';
}
function hbar(obj){
  const e = Object.entries(obj).sort((a, b) => b[1] - a[1]); const mx = e[0][1];
  return e.map(([k, v]) => `<div style="display:grid;grid-template-columns:110px minmax(0,1fr) 34px;gap:10px;align-items:center;margin-bottom:10px;font-size:12.5px"><span class="tag" style="justify-self:start">${k}</span><div class="bar" style="height:12px"><i style="width:${v / mx * 100}%;background:var(--steel2)"></i></div><b class="num" style="text-align:right">${v}</b></div>`).join('');
}
function marginChart(){
  const W = 520, H = 200, pl = 34, pb = 44, pt = 12, l = S.contracts.map(c => ({t:c.title, m:(c.price - c.cost) / c.price})), mx = 0.3;
  const bw = (W - pl) / l.length, y = v => H - pb - (H - pb - pt) * v / mx;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Маржа по контрактам">`;
  [0, 0.1, 0.2, 0.3].forEach(t => s += `<line x1="${pl}" x2="${W - 4}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${pl - 6}" y="${y(t) + 4}" text-anchor="end">${Math.round(t * 100)}%</text>`);
  l.forEach((c, i) => { const x = pl + i * bw + bw * 0.25, w = bw * 0.5; s += `<rect x="${x}" y="${y(c.m)}" width="${w}" height="${y(0) - y(c.m)}" rx="3" fill="${c.m >= S.profile.margin ? 'var(--go)' : 'var(--cond)'}"/><text x="${x + w / 2}" y="${y(c.m) - 6}" text-anchor="middle" style="fill:var(--tx);font-weight:600">${pct(c.m)}</text><text x="${x + w / 2}" y="${H - 26}" text-anchor="middle">${esc(c.t.split(' ').slice(-2).join(' ').slice(0, 22))}</text>`; });
  s += `<line x1="${pl}" x2="${W - 4}" y1="${y(S.profile.margin)}" y2="${y(S.profile.margin)}" stroke="var(--gold)" stroke-dasharray="5 4" stroke-width="1.5"/>`;
  return s + '</svg>';
}

  $('#chatIn').value = '';
  setTimeout(() => {
    const n2 = new Date(); t.msgs.push({me:false, t:reply(text, t), d:T() + ' ' + pad(n2.getHours()) + ':' + pad(n2.getMinutes()), who:'Полина · юрист'}); save();
    if (R.v === 'chat' && CHAT.cur === t.id) { const ty = $('#typing'); if (ty) ty.remove(); box.insertAdjacentHTML('beforeend', msgHtml(t.msgs[t.msgs.length - 1])); box.scrollTop = box.scrollHeight; }
  }, 1500);
}
function reply(q, t){
  const l = q.toLowerCase(); const p = t.proc ? S.procs.find(x => x.id === t.proc) : S.procs.find(x => x.id === S.lastProc); const e = p ? ev(p) : null;
  if (/срок|успе|постав|опозд/.test(l)) return p ? `По «${p.title}»: по контракту ${p.deliveryWD} р. д., у вас производство ${S.profile.leadWD} р. д.${p.install ? ' + монтаж ' + S.profile.installWD : ''}. ${p.deliveryWD >= S.profile.leadWD + (p.install ? S.profile.installWD : 0) ? 'Запас есть, но отгрузку зафиксируйте письменно.' : 'Без предзаказа у фабрики не подавайтесь.'} Пени поставщика — 1/300 ключевой ставки от цены контракта за каждый день (ч. 7 ст. 34 44-ФЗ): это ${rub(peni(p.nmck, 1))} в день.` : 'Пришлите номер закупки — сверю срок с вашей логистикой.';
  if (/гаранти|обеспеч|залог/.test(l)) return p ? `Обеспечение исполнения — ${rub(p.nmck * p.sec)}. Деньгами оно выйдет из оборота примерно на ${moneyDays(p)} дн. (стоимость денег ≈ ${rub(p.nmck * p.sec * S.profile.rate * moneyDays(p) / 365)}). Независимая гарантия обойдётся дешевле и не заберёт оборотку — подобрать можно в разделе «Тариф и оплата».` : 'Сравню гарантию и деньги, если укажете закупку.';
  if (/цен|сниж|демпинг|торг/.test(l)) return e ? `Нижняя цена — ${rub(e.calc.lower)}, ниже неё контракт убыточен. Целевая — ${rub(e.calc.target)}. Помните: при снижении на 25% и более действуют антидемпинговые меры ст. 37 44-ФЗ — обеспечение вырастет в 1,5 раза.` : 'Посчитаю нижнюю цену, как только выберете закупку.';
  if (/нац|реестр|происхожд|российск/.test(l)) return `Национальный режим сейчас регулируется ${LAW.pp1875}. Для товаров из ваших позиций указываем номера реестровых записей — без них заявка проигрывает заявкам с российским товаром. ${S.profile.registry ? 'У вас реестровые записи в паспорте есть.' : 'В паспорте реестровых записей нет — это стоит закрыть в первую очередь.'}`;
  if (/плат|не плат|претенз|приёмк|приемк/.test(l)) return `Срок оплаты — не более 7 рабочих дней с подписания документа о приёмке (ч. 13.1 ст. 34 44-ФЗ). При просрочке начисляются пени — 1/300 ключевой ставки от неоплаченной суммы за каждый день (ч. 5 ст. 34). Претензия формируется в разделе «Контракты» одной кнопкой.`;
  if (/жалоб|фас|отклон/.test(l)) return 'Если заявку отклонили по основанию, которого нет в извещении, можно обжаловать действия комиссии в контрольный орган в порядке статьи 105 44-ФЗ. Пришлите протокол — проверю основания и сроки.';
  return 'Принято. Посмотрю документацию и отвечу в течение часа. Если вопрос по конкретной закупке — откройте её разбор и нажмите «Спросить специалиста», так я сразу увижу контекст.';
}

/* =====================================================================
   ЭКСКУРСИЯ
   ===================================================================== */
const TOUR = {on:false, i:0, steps:[
  {r:'dash', s:'#nav', t:'Все разделы под рукой', d:'От ленты закупок до контроля исполнения контракта. На телефоне — панель внизу, остальные разделы в «Ещё». Сверху — поиск и кнопка новой закупки.'},
  {r:'dash', s:'#sonarWrap', t:'Сонар закупок', d:'Каждая точка — закупка из ЕИС по вашему профилю. Ближе к центру — выше оценка исполнимости, цвет — вердикт. Нажмите на точку — откроется разбор.'},
  {r:'dash', s:'#addBtn', t:'Новая закупка за 2 минуты', d:'Вставьте номер из ЕИС или загрузите документацию: сервис прочитает извещение, ТЗ и проект контракта и вынесет вердикт.'},
  {r:'proc-mayak', s:'.verdict', t:'Вердикт с цитатами', d:'«Участвовать», «при условии» или «не участвовать» — и нижняя цена, ниже которой контракт убыточен.', tab:'req'},
  {r:'proc-mayak', s:'#clauses', t:'Каждое требование — с цитатой', d:'Что написано в документе, что это значит для вас и что сделать. Отметьте выполненное условие — вердикт пересчитается.', tab:'req'},
  {r:'calc', s:'#fw-cf', t:'Фарватер цены', d:'Перетащите кораблик: слева мель — убыток, дальше узкий проход и фарватер с целевой маржой. Цифры на воде — маржа в процентах.'},
  {r:'contracts', s:'.ctr', t:'После победы', d:'Сроки поставки, приёмки и оплаты в рабочих днях. Просрочил заказчик — пени и претензия считаются сами.'},
  {r:'profile', s:'#profForm', t:'Паспорт поставщика', d:'Лицензии, сроки производителя, оборотные средства, регионы. Измените и сохраните — все вердикты пересчитаются.'}
]};
ACT.tour = () => { closePops(); closeAllModals(); S.ui.welcome = false; TOUR.on = true; TOUR.i = 0; tourStep(); };
function tourStep(){
  const st = TOUR.steps[TOUR.i]; if (st.tab) PTAB = st.tab;
  if (('#' + st.r) !== location.hash) go(st.r); else if (st.tab) render();
  setTimeout(() => {
    const mob = innerWidth <= 900;
    const el = $(mob && st.s === '#nav' ? '#tabbar' : st.s); if (!el) { nextTour(); return; }
    el.scrollIntoView({block:'center'});
    setTimeout(() => placeTour(el, st), 220);
  }, 120);
}
function placeTour(el, st){
  let hole = $('#tourHole'), pop = $('#tourPop');
  if (!hole) { hole = document.createElement('div'); hole.id = 'tourHole'; hole.className = 'tour-hole'; document.body.appendChild(hole); pop = document.createElement('div'); pop.id = 'tourPop'; pop.className = 'tour-pop'; document.body.appendChild(pop); }
  const b = el.getBoundingClientRect(), m = 6;
  const r = {l:Math.max(4, b.left - m), t:Math.max(4, b.top - m), w:Math.min(innerWidth - 8, b.width + m * 2), h:Math.min(innerHeight - 8, b.height + m * 2)};
  Object.assign(hole.style, {left:r.l + 'px', top:r.t + 'px', width:r.w + 'px', height:r.h + 'px'});
  pop.innerHTML = `<div class="k">ШАГ ${TOUR.i + 1} ИЗ ${TOUR.steps.length}</div><b>${st.t}</b><p>${st.d}</p><div class="row between"><button class="btn sm ghost" id="tSkip">Завершить</button><div class="row">${TOUR.i ? '<button class="btn sm" id="tPrev">Назад</button>' : ''}<button class="btn sm gold" id="tNext">${TOUR.i === TOUR.steps.length - 1 ? 'Готово' : 'Дальше'}</button></div></div>`;
  const pw = Math.min(340, innerWidth - 32), ph = pop.offsetHeight || 180;
  let left = r.l + r.w + 16, top = r.t;
  if (left + pw > innerWidth - 16) { left = clamp(r.l, 16, innerWidth - pw - 16); top = r.t + r.h + 14; if (top + ph > innerHeight - 16) top = Math.max(16, r.t - ph - 14); }
  if (top + ph > innerHeight - 16) top = innerHeight - ph - 16;
  Object.assign(pop.style, {left:left + 'px', top:Math.max(16, top) + 'px'});
  $('#tNext').onclick = nextTour; $('#tSkip').onclick = endTour; const pv = $('#tPrev'); if (pv) pv.onclick = () => { TOUR.i--; tourStep(); };
}
function nextTour(){ if (TOUR.i >= TOUR.steps.length - 1) { endTour(); toast('Экскурсия завершена. Всё в прототипе кликабельно — пробуйте'); go('dash'); return; } TOUR.i++; tourStep(); }
function endTour(){ TOUR.on = false; S.ui.tourDone = true; save(); ['#tourHole', '#tourPop'].forEach(s => { const e = $(s); if (e) e.remove(); }); closeDrawer(); }
window.addEventListener('resize', () => { if (TOUR.on) { const st = TOUR.steps[TOUR.i], el = $(st.s); if (el) placeTour(el, st); } });

/* =====================================================================
   ПОИСК И КОМАНДЫ (Ctrl K)
   ===================================================================== */
ACT.cmd = () => {
  if ($('.cmd')) return; closePops();
  const items = [
    ...NAV.filter(n => n.k).map(n => ({g:'Разделы', t:n.t, s:'раздел', run:() => go(n.k)})),
    ...S.procs.map(p => ({g:'Закупки', t:p.title, s:VSHORT[ev(p).verdict] + ' · ' + short(p.nmck), q:p.customer + ' ' + p.num, run:() => go('proc-' + p.id)})),
    ...S.contracts.map(c => ({g:'Контракты', t:c.title, s:short(c.price), q:c.customer + ' ' + c.num, run:() => go('contracts')})),
    {g:'Действия', t:'Разобрать новую закупку', s:'', run:() => ACT.add()},
    {g:'Действия', t:'Сменить тему оформления', s:'', run:() => ACT.theme()},
    {g:'Действия', t:'Экскурсия по сервису', s:'', run:() => ACT.tour()},
    {g:'Действия', t:'Претензия о просрочке оплаты', s:'документ', run:() => ACT.mkDoc({dataset:{t:'claim'}})},
    {g:'Действия', t:'Запрос на разъяснение', s:'документ', run:() => ACT.mkDoc({dataset:{t:'clarify'}})},
    {g:'Действия', t:'Сбросить демо-данные', s:'', run:() => ACT.reset()}
  ];
  const w = document.createElement('div'); w.className = 'scrim';
  w.innerHTML = `<div class="modal cmd" role="dialog" aria-label="Поиск"><div class="ci">${I.search}<input id="cmdIn" placeholder="Закупка, заказчик, номер или команда…" autocomplete="off"><kbd class="mono small muted">Esc</kbd></div><div class="res" id="cmdRes"></div></div>`;
  w.addEventListener('mousedown', e => { if (e.target === w) w.remove(); });
  $('#modals').appendChild(w);
  const inp = w.querySelector('#cmdIn'); let sel = 0, list = [];
  $$('svg', w.querySelector('.ci')).forEach(s => { s.style.width = '18px'; s.style.color = 'var(--tx3)'; });
  const draw = () => {
    const q = inp.value.trim().toLowerCase();
    list = items.filter(i => !q || (i.t + ' ' + (i.q || '') + ' ' + i.s).toLowerCase().includes(q)).slice(0, 14);
    sel = Math.min(sel, Math.max(0, list.length - 1)); let g = '';
    w.querySelector('#cmdRes').innerHTML = list.map((i, k) => (i.g !== g ? '<div class="gh">' + (g = i.g) + '</div>' : '') + `<div class="r ${k === sel ? 'on' : ''}" data-k="${k}">${esc(i.t)}<small>${esc(i.s)}</small></div>`).join('') || '<div class="empty">Ничего не найдено</div>';
    $$('.r', w).forEach(r => { r.onclick = () => { w.remove(); list[+r.dataset.k].run(); }; r.onmousemove = () => { if (sel !== +r.dataset.k) { sel = +r.dataset.k; draw(); } }; });
  };
  inp.oninput = () => { sel = 0; draw(); };
  inp.onkeydown = e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(list.length - 1, sel + 1); draw(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(0, sel - 1); draw(); }
    if (e.key === 'Enter' && list[sel]) { e.preventDefault(); w.remove(); list[sel].run(); }
    if (e.key === 'Escape') { e.stopPropagation(); w.remove(); }
  };
  draw(); inp.focus();
};

/* ---------- искры (победа, вердикт «идём») ---------- */
function fx(x, y, kind, n){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = $('#fx'), ctx = cv.getContext('2d'), dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  const cols = kind === 'go' ? [cssv('--go'), cssv('--gold2'), '#ffffff'] : [cssv('--gold'), cssv('--gold2'), cssv('--go')];
  const ps = Array.from({length:n}, () => ({x, y, vx:(Math.random() - 0.5) * 9, vy:-Math.random() * 9 - 2, r:2 + Math.random() * 3, c:cols[Math.floor(Math.random() * cols.length)], a:1, rot:Math.random() * 6}));
  let f = 0;
  (function loop(){
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, innerWidth, innerHeight);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.28; p.a -= 0.012; p.rot += 0.1; ctx.globalAlpha = Math.max(0, p.a); ctx.fillStyle = p.c; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); ctx.restore(); });
    if (++f < 90) requestAnimationFrame(loop); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  })();
}

/* ---------- запуск ---------- */
function boot(){
  S = load(); evAll();
  $('#menuBtn').innerHTML = I.menu; $('#sIc').innerHTML = I.search.replace('<svg', '<svg width="16" height="16"'); $('#addIc').innerHTML = I.plus.replace('<svg', '<svg width="16" height="16"');
  try { if (!location.hash) history.replaceState(null, '', '#dash'); } catch(e) {}
  render();
}
boot();

</script>
